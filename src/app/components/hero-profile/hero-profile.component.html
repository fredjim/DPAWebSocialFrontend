<div class="hero-profile" *ngIf="showHero">
	<div class="hero-images">
		<div class="hero-photo">
			<img *ngIf="institution && hasBackgroundImage" [src]="institution.background_url" alt="Portada de la institucion">
			<div *ngIf="institution && !hasBackgroundImage" class="hero-photo-placeholder">
				<span class="placeholder-label">Sin portada</span>
			</div>
		</div>
		<div class="profile-photo">
			<app-institution-avatar [institution]="institution" size="large"></app-institution-avatar>
		</div>
	</div>
	<h3 class="profile-information" *ngIf="institution">{{ institution.name }}</h3>
</div>
