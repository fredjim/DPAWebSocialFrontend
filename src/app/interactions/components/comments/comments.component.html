<div [ngClass]="{'modal-container': modalBoostrap, 'modal-fixed-footer': !modalBoostrap}">
  @if(modalBoostrap) {
    <!-- Modal Header -->
    <div class="modal-header text-center">
      <h4 class="modal-title w-100">Publicación de {{ institution.name }}</h4>
      <button type="button" class="btn-close" aria-label="Close" (click)="modal.dismissAll('Cross click')"></button>
    </div>
  }

  <!-- Modal Body -->
  <div class="modal-body">
    <div class="post-details">
      <!-- Información del autor -->
      <div class="d-flex flex-column">
        <div class="d-flex flex-row justify-content-start" *ngIf="institution">
          <app-institution-avatar 
            [institution]="institution" 
            size="medium" 
            class="img-profile">
          </app-institution-avatar>
          <div class="info-user">
            <h2>{{ institution.name }}</h2>
            <p>{{ calculateTimePost() }}</p>
          </div>
        </div>

        <!-- Descripción del post -->
        <p class="post-description" [innerHTML]="post.content.text | linkify"></p>

        <!-- Visualizar documentos de post -->
        <div *ngIf="docsPost.length > 0" class="documents-list d-flex flex-column gap-2 mt-2 px-2">
          <ng-container *ngFor="let doc of docsPost">
            <a [href]="doc.path" target="_blank" class="text-decoration-none">
              <i class="bi bi-file-earmark-pdf-fill"></i> {{ doc.name || 'Documento PDF' }}
            </a>
          </ng-container>
        </div>

        <!-- Imagen o contenido multimedia -->
        <div class="object-fit-md-contain border rounded">
          <ng-container *ngIf="mediaPost.length > 0">
            <p-carousel [value]="mediaPost" 
                        [numVisible]="1" 
                        [numScroll]="1" 
                        [circular]="mediaPost.length > 1"
                        [showIndicators]="false" 
                        [showNavigators]="mediaPost.length > 1"
                        [page]="initialMediaIndex"
                        (onPage)="onCarouselPageChange()">
              <ng-template pTemplate="item" let-media>
                <div class="image-box text-center">

                  <ng-container *ngIf="media.type.includes('image')">
                    <div class="zoom-container" [class.zoomed]="zoomLevel > 1">
                      <img
                        [src]="media.path"
                        alt=""
                        draggable="false"
                        [style.transform]="'scale(' + zoomLevel + ') translate(' + panX + 'px, ' + panY + 'px)'"
                        (pointerdown)="startPan($event)"
                        (pointermove)="onPan($event)"
                        (pointerup)="endPan($event)"
                        (pointercancel)="endPan($event)" />
                    </div>

                    <div class="zoom-controls">
                      <button type="button" (click)="zoomOut()" [disabled]="zoomLevel <= minZoom" aria-label="Alejar">
                        <i class="pi pi-search-minus"></i>
                      </button>
                      <button type="button" (click)="resetZoom()" [disabled]="zoomLevel === 1" aria-label="Restablecer zoom">
                        <i class="pi pi-refresh"></i>
                      </button>
                      <button type="button" (click)="zoomIn()" [disabled]="zoomLevel >= maxZoom" aria-label="Acercar">
                        <i class="pi pi-search-plus"></i>
                      </button>
                    </div>
                  </ng-container>

                  <ng-container *ngIf="media.type.includes('video')">
                    <video [src]="media.path" controls class="video"></video>
                  </ng-container>

                  <button
                    type="button"
                    class="download-btn"
                    (click)="downloadMedia(media, $event)"
                    title="Descargar"
                    aria-label="Descargar">
                    <i class="pi pi-download"></i>
                  </button>

                </div>
              </ng-template>
            </p-carousel>
          </ng-container>
        </div>

        <!-- Lista de comentarios -->
        <app-comment-list [comments]="comments" 
          [postUuid]="post.uuid"
          [currentUser]="currentUser" 
          [authenticated]="authenticated" 
          [commentsEnabled]="post.commentsEnabled"
          (onAddReply)="handleAddReply($event)">
        </app-comment-list>
      </div>
    </div>
  </div>

  <!-- Modal Footer -->
  <div class="modal-footer" *ngIf="authenticated && post.commentsEnabled">
    <div class="comment-section d-flex flex-row align-items-center">
      <app-user-avatar [user]="currentUser" [size]="'small'" [responsive]="true"></app-user-avatar>
      <div class="comment-box d-flex align-items-center">
        <input [(ngModel)]="newComment" placeholder="Escribe un comentario..." class="comment-input" (keydown.enter)="addComment()" />
        <button (click)="addComment()" class="send-comment-button">
          <i class="bi bi-send"></i>
        </button>
      </div>
    </div>
  </div>
</div>

<app-custom-toast #toastRef key="donwloadMedia" position="top-right"></app-custom-toast>
