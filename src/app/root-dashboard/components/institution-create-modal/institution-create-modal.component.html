<p-dialog
  [visible]="visible"
  (visibleChange)="visibleChange.emit($event)"
  [modal]="true"
  [closable]="true"
  [draggable]="false"
  header="Nueva Institución"
  [style]="{ width: '700px' }"
  (onHide)="close()"
  styleClass="custom-create-dialog"
>
  <form [formGroup]="form" (ngSubmit)="save()" id="createInstForm" class="pt-2">
    <div class="row g-4">
      <div class="col-12">
        <label class="form-label">Nombre de la Institución <span class="text-danger">*</span></label>
        <input pInputText formControlName="name" class="w-100" placeholder="Ej: Dirección de Planificación Académica" />
        <small class="text-danger-msg" *ngIf="hasError('name', 'required')">El nombre es obligatorio</small>
      </div>

      <div class="col-md-6">
        <label class="form-label">Slug / Identificador <span class="text-danger">*</span></label>
        <div class="p-inputgroup">
          <span class="p-inputgroup-addon">/</span>
          <input pInputText formControlName="slug" class="w-100" placeholder="mi-institucion" />
        </div>
        <small class="text-muted-info">Solo minúsculas, números y guiones</small>
        <small class="text-danger-msg" *ngIf="hasError('slug', 'pattern')">Formato inválido</small>
      </div>

      <div class="col-md-6">
        <label class="form-label">Categoría <span class="text-danger">*</span></label>
        <input pInputText formControlName="category" class="w-100" placeholder="Educación" />
        <small class="text-danger-msg" *ngIf="hasError('category', 'required')">Requerido</small>
      </div>

      <div class="col-12">
        <label class="form-label">Descripción <span class="text-danger">*</span></label>
        <textarea
          pInputText
          formControlName="description"
          class="w-100"
          rows="3"
          placeholder="Escribe una breve descripción de la institución..."
        ></textarea>
      </div>

      <div class="col-12">
        <label class="form-label">Ubicación Física <span class="text-danger">*</span></label>
        <div class="p-inputgroup">
          <span class="p-inputgroup-addon"><i class="fa-solid fa-location-dot"></i></span>
          <input pInputText formControlName="location" class="w-100" placeholder="Av. Principal 123, Ciudad" />
        </div>
      </div>

      <div class="col-md-6">
        <label class="form-label">Correo de Contacto <span class="text-danger">*</span></label>
        <div class="p-inputgroup">
          <span class="p-inputgroup-addon"><i class="fa-solid fa-envelope"></i></span>
          <input pInputText type="email" formControlName="email" class="w-100" placeholder="contacto@inst.edu.bo" />
        </div>
        <small class="text-danger-msg" *ngIf="hasError('email', 'email')">Email inválido</small>
      </div>

      <div class="col-md-6">
        <label class="form-label">Teléfono <span class="text-danger">*</span></label>
        <div class="p-inputgroup">
          <span class="p-inputgroup-addon"><i class="fa-solid fa-phone"></i></span>
          <input pInputText formControlName="phone" class="w-100" placeholder="+591 ..." />
        </div>
      </div>

      <div class="col-12">
        <label class="form-label">URL del sitio web <span class="text-danger">*</span></label>
        <div class="p-inputgroup">
          <span class="p-inputgroup-addon">https://</span>
          <input pInputText formControlName="url" class="w-100" placeholder="inst.edu.bo" />
        </div>
      </div>
    </div>
  </form>

  <ng-template pTemplate="footer">
    <button type="button" class="btn btn-outline-secondary px-4" (click)="close()" [disabled]="isSaving">
      Cancelar
    </button>
    <button type="submit" form="createInstForm" class="btn btn-primary px-4" [disabled]="isSaving">
      <span *ngIf="isSaving" class="spinner-border spinner-border-sm me-2"></span>
      <i class="fa-solid fa-plus me-2" *ngIf="!isSaving"></i>
      {{ isSaving ? 'Creando...' : 'Crear Institución' }}
    </button>
  </ng-template>
</p-dialog>

<app-custom-toast #toastRef key="institutionCreateToast" position="top-right"></app-custom-toast>
