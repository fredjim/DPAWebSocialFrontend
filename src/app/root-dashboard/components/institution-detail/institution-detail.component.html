<div class="detail-container">
  <div class="detail-header">
    <a routerLink="/root/dashboard" class="btn btn-sm btn-outline-secondary btn-back">
      <i class="fa-solid fa-chevron-left"></i> Volver
    </a>
    <div class="header-info">
      <div class="d-flex align-items-center gap-2">
        <h3 class="page-title">{{ institution?.name ?? 'Cargando...' }}</h3>
        <span class="badge-slug" *ngIf="institution?.slug">{{ institution?.slug }}</span>
      </div>
      <p class="page-subtitle" *ngIf="institution?.url">
        <i class="fa-solid fa-link me-1 opacity-50"></i> {{ institution?.url }}
      </p>
    </div>
  </div>

  <div *ngIf="isLoading()" class="loader-container">
    <p-progressSpinner strokeWidth="4" styleClass="spinner-md" />
  </div>

  <p-tabView *ngIf="!isLoading()" styleClass="institution-tabs custom-tabs">
    <!-- Tab 1: Información -->
    <p-tabPanel>
      <ng-template pTemplate="header">
        <i class="fa-solid fa-circle-info me-2"></i> Información
      </ng-template>
      
      <form [formGroup]="form" (ngSubmit)="update()" class="detail-form">
        <div class="form-section">
          <div class="section-title">
            <i class="fa-solid fa-sliders me-2"></i> Configuración General
          </div>
          <div class="row g-4">
            <div class="col-12">
              <label class="form-label">Nombre de la Institución <span class="text-danger">*</span></label>
              <input pInputText formControlName="name" class="w-100" placeholder="Ej: Universidad Mayor de San Simón" />
              <small class="text-danger-msg" *ngIf="hasError('name', 'required')">El nombre es obligatorio</small>
            </div>

            <div class="col-md-6">
              <label class="form-label">Slug / Identificador <span class="text-danger">*</span></label>
              <div class="p-inputgroup">
                <span class="p-inputgroup-addon">/</span>
                <input pInputText formControlName="slug" class="w-100" placeholder="mi-institucion" />
              </div>
              <small class="text-danger-msg" *ngIf="hasError('slug', 'pattern')">Formato inválido (solo minúsculas y guiones)</small>
            </div>

            <div class="col-md-6">
              <label class="form-label">Categoría <span class="text-danger">*</span></label>
              <input pInputText formControlName="category" class="w-100" placeholder="Ej: Educación Superior" />
            </div>

            <div class="col-12">
              <label class="form-label">Descripción Breve <span class="text-danger">*</span></label>
              <textarea pInputText formControlName="description" class="w-100" rows="4" placeholder="Escribe una breve descripción..."></textarea>
            </div>
          </div>
        </div>

        <div class="form-section">
          <div class="section-title">
            <i class="fa-solid fa-address-card me-2"></i> Contacto y Ubicación
          </div>
          <div class="row g-4">
            <div class="col-12">
              <label class="form-label">Dirección / Ubicación <span class="text-danger">*</span></label>
              <div class="p-inputgroup">
                <span class="p-inputgroup-addon"><i class="fa-solid fa-location-dot"></i></span>
                <input pInputText formControlName="location" class="w-100" placeholder="Calle, Número, Ciudad" />
              </div>
            </div>

            <div class="col-md-6">
              <label class="form-label">Correo Electrónico <span class="text-danger">*</span></label>
              <div class="p-inputgroup">
                <span class="p-inputgroup-addon"><i class="fa-solid fa-envelope"></i></span>
                <input pInputText type="email" formControlName="email" class="w-100" placeholder="contacto@ejemplo.com" />
              </div>
              <small class="text-danger-msg" *ngIf="hasError('email', 'email')">Email no válido</small>
            </div>

            <div class="col-md-6">
              <label class="form-label">Teléfono de Contacto <span class="text-danger">*</span></label>
              <div class="p-inputgroup">
                <span class="p-inputgroup-addon"><i class="fa-solid fa-phone"></i></span>
                <input pInputText formControlName="phone" class="w-100" placeholder="+591 ..." />
              </div>
            </div>

            <div class="col-12">
              <label class="form-label">Sitio Web Oficial <span class="text-danger">*</span></label>
              <div class="p-inputgroup">
                <span class="p-inputgroup-addon">https://</span>
                <input pInputText formControlName="url" class="w-100" placeholder="www.ejemplo.com" />
              </div>
            </div>
          </div>
        </div>

        <div class="form-actions row">
          <div class="col-12 d-flex justify-content-end">
            <ui-button
              [label]="isSaving() ? 'Guardando...' : 'Guardar cambios'"
              type="submit"
              severity="success"
              size="lg"
              [loading]="isSaving()"
              [disabled]="isSaving()"
            ></ui-button>
          </div>
        </div>
      </form>
    </p-tabPanel>

    <!-- Tab 2: Usuarios Admin -->
    <p-tabPanel>
      <ng-template pTemplate="header">
        <i class="fa-solid fa-users-gear me-2"></i> Administradores
      </ng-template>
      <div class="tab-section-wrap">
        <app-admin-users-table [institutionUuid]="uuid" class="d-block" />
      </div>
    </p-tabPanel>

    <!-- Tab 3: Facebook Config -->
    <p-tabPanel>
      <ng-template pTemplate="header">
        <i class="fa-brands fa-facebook me-2"></i> Configuración Facebook
      </ng-template>
      <div class="tab-section-wrap">
        <app-facebook-config [institutionUuid]="uuid" class="d-block" />
      </div>
    </p-tabPanel>
  </p-tabView>
</div>

<app-custom-toast #toastRef key="institutionDetailToast" position="top-right"></app-custom-toast>
