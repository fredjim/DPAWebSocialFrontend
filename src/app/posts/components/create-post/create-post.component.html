<!-- Seccion posts  ¿Qué estás pensando?-->
@if (institution) {
<div class="create-post-container">
	<div class="d-flex gap-3 align-items-center w-100">
		@if (institution) {
			<app-institution-avatar [institution]="institution" size="small"></app-institution-avatar>
		}
		<div class="new-post fw-semibold ml-3" (click)="openModalCreatePost()" (keypress)="openModalCreatePost()">
			<p>Crea una publicación</p>
		</div>
	</div>
</div>
}

<!-- Modal crear un post -->
<div #modalCreatePost class="modal fade" id="modalCreatePost" tabindex="-1" aria-labelledby="modalNewPost" aria-hidden="true">
	<div class="modal-dialog modal-dialog-centered">
		<div class="modal-content">
			<div class="modal-header p-2">
				<h5 class="modal-title fw-bold" id="modalNewPost">Crear publicación</h5>
				<button type="button" class="btn-close m-0" data-bs-dismiss="modal" aria-label="Close" (click)="closeModal()"></button>
			</div>
			<div class="modal-body user-post-container">
				<div class="info-user d-flex gap-3 mb-3">
					@if (institution) {
						<app-institution-avatar [institution]="institution" size="small"></app-institution-avatar>
						<div>
							<p class="fw-bold fs-6">{{ institution.name }}</p>
							<select id="option-comment" *ngIf="commentConfig" [(ngModel)]="selectedCommentConfig">
								<option *ngFor="let config of commentConfig" [value]="config.uuid">{{config.name}}
								</option>
							</select>
						</div>
					}
				</div>
				<form [formGroup]="postForm" class="form d-flex flex-column">
					<div class="container">
						<!-- Texto del post -->
						<app-text-editor [isVisibleModal]="visibleModalCreate" [maxLength]="maxLengthText" (textChangeEvent)="getTextPost($event)"></app-text-editor>						
					</div>

					<!-- Seleccionar redes sociales para compartir publicacion -->
					<div class="add-media d-flex flex-row align-items-center justify-content-between">
						<p class="fw-semibold">Redes Sociales para compartir</p>
						<div class="add-post d-flex ">
							<div class=" form-check form-switch">
								<input class="form-check-input" type="checkbox"
									id="flexSwitchCheckDefault" formControlName="switchControl">
								<i class="bi bi-facebook custom-facebook-color"></i>
							</div>
						</div>
					</div>

					<div class="container">
						<!-- Seleccionar imagen (es) -->
						<app-images-uploader [showAreaMedia]="visibleAreaMedia" [isVisibleModal]="visibleModalCreate"
							(closeAreaMediaEvent)="closeAreaMedia($event)"
							(loadFilesMediaEvent)="getFilesImagesPost($event)"></app-images-uploader>

						<!-- Seleccionar archivo -->
						<app-document-uploader [showAreaDoc]="visibleAreaMediaDoc" [isVisibleModal]="visibleModalCreate"
							(closeAreaDocEvent)="closeAreaDoc($event)"
							(loadFileDoc)="getFileDocPost($event)"></app-document-uploader>
					</div>
					
					<!-- Añadir a la publicacion -->
					<div class="add-media d-flex flex-row align-items-center justify-content-between">
						<p class="fw-semibold">Añadir a tu publicación</p>
						<div class="add-post d-flex ">
							<span class="d-flex align-items-center" [ngClass]="{'disabled': disableLoadImage()}"
								(click)="!disableLoadImage() && showAreaMedia()" (keypress)="!disableLoadImage() && showAreaMedia()"><i class="bi bi-image fs-5"></i></span>
							<span class="d-flex align-items-center" [ngClass]="{'disabled': disableLoadDoc()}"
								(click)="!disableLoadDoc() && showAreaDoc()" (keypress)="!disableLoadDoc() && showAreaDoc()"><i
									class="bi bi-file-earmark-text-fill fs-5"></i></span>
						</div>
					</div>
					<ui-button
						label="Publicar"
						type="button"
						severity="primary"
						[disabled]="disabledPublishButton()"
						(clicked)="post()"
					></ui-button>
				</form>
			</div>
		</div>
	</div>
</div>

<div *ngIf="isLoading" class="d-flex justify-content-center align-items-center bg-dark bg-opacity-50 position-fixed top-0 start-0 w-100 h-100" id="loadingBackdrop" style="z-index: 1080; display: none !important;">
  <div class="spinner-border text-primary" aria-live="polite" aria-label="Cargando">
    <span class="visually-hidden">Cargando...</span>
  </div>
</div>

<app-custom-toast #toastRef key="newPostToast" position="top-right"></app-custom-toast>
