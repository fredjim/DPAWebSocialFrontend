<div class="textarea-container">
    <div
        class="post-editor"
        contenteditable="true"
        role="textbox"
        aria-multiline="true"
        aria-label="Área de texto para crear publicación"
        data-placeholder="¿Qué estás pensando?"
        spellcheck="false"
        [class.exceeded]="isExceeded"
        #editorRef
    ></div>

    <div class="char-counter" [class.exceeded]="isExceeded">
        <span>{{ currentLength }}</span> / {{ maxLength }}
        <span *ngIf="isExceeded" class="error-message">
          Has alcanzado el límite de {{ maxLength }} caracteres
        </span>
    </div>
</div>
