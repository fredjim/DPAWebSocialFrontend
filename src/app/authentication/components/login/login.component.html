<!-- Modal -->
<div #loginModal class="modal fade" id="loginModal" tabindex="-1" aria-labelledby="loginModal" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title fw-semibold" id="registerModalLabel">Inicio de Sesión</h5>
        <!-- Botón de Cierre "X" -->
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" (click)="loginReset()"></button>
      </div>

      <div class="modal-body">

        <!-- Formulario login -->
        <div class="container">
          <form [formGroup]="loginForm" (ngSubmit)="login()" class="needs-validation" novalidate>
            <div class="mb-3 mt-3">
              <label for="email" class="form-label">Correo Electrónico</label>
              <input type="email" class="form-control"
                [ngClass]="{'is-invalid': hasErrors('username', 'required') || hasErrors('username', 'email') || !correctCredentials || credentialsAnotherInstitution }"
                id="emailLG" formControlName="username" />
              <div class="invalid-feedback" *ngIf="hasErrors('username', 'required')">Correo requerido</div>
              <div class="invalid-feedback" *ngIf="hasErrors('username', 'email')">Correo inválido</div>
              <div class="invalid-feedback" *ngIf="!correctCredentials">Correo o contraseña incorrectos</div>
              <div *ngIf="!hasErrors('username', 'required') && !hasErrors('username', 'email') && correctCredentials"
                style="min-height: 25px;"></div>
            </div>

            <div class="mb-3">
              <label for="password" class="form-label">Contraseña</label>
              <div class="input-password">
                <input [type]="inputType" class="form-control" [ngClass]="{ 'is-invalid': hasErrors('password', 'required') || 
                        !correctCredentials || 
                        credentialsAnotherInstitution }" id="passwordLG" formControlName="password" />
                <div class="eye" (click)="togglePasswordVisibility()" (keypress)="togglePasswordVisibility()">
                  <i class="bi bi-eye-fill" *ngIf="!hide && !hasErrors('password', 'required')"></i>
                  <i class="bi bi-eye-slash-fill" *ngIf="hide && !hasErrors('password', 'required')"></i>
                </div>
      
                <div class="invalid-feedback" *ngIf="hasErrors('password', 'required')">Contraseña requerida</div>
                <div class="invalid-feedback" *ngIf="!correctCredentials">
                  Correo o contraseña incorrectos
                </div>
                <div class="invalid-feedback" *ngIf="credentialsAnotherInstitution">
                  Correo y contraseña no pertenece a esta institución
                </div>
                <div *ngIf="!hasErrors('password', 'required') && correctCredentials && !credentialsAnotherInstitution"
                  style="min-height: 25px;"></div>
              </div>
            </div>
      
            <!-- Aviso email no verificado -->
            <div *ngIf="emailNotVerified" class="alert alert-warning py-2 mb-3" role="alert">
              <i class="pi pi-envelope me-1"></i>
              Debes verificar tu email antes de iniciar sesión. Revisa tu bandeja de entrada.
            </div>
      
            <!-- Link olvidé contraseña -->
            <div class="text-end mb-3">
              <a href="javascript:void(0)" class="text-decoration-none small" data-bs-dismiss="modal"
                (click)="openForgotPassword()">¿Olvidaste tu contraseña?</a>
            </div>
      
            <div class="botones">
              <ui-button
                type="submit" 
                label="Entrar" 
                icon="pi pi-sign-in" 
                [loading]="isLoading"
                [fullWidth]="true">
              </ui-button>
              <ui-button 
                type="button" 
                label="Cancelar" 
                severity="secondary" 
                variant="outlined" 
                [fullWidth]="true"
                bsDismiss="modal" 
                (clicked)="loginReset()">
              </ui-button>
            </div>
          </form>
        </div>
      </div>

      <!-- Dialog recuperar contraseña -->
      <app-forgot-password #forgotPasswordRef></app-forgot-password>
      <app-custom-toast #toastRef key="loginToast" position="top-right"></app-custom-toast>

   </div>
  </div>
</div>

<app-custom-toast #toastRef key="loginToast" position="top-right"></app-custom-toast>
