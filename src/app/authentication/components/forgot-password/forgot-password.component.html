<p-dialog
  header="Recuperar contraseña"
  [(visible)]="visible"
  [modal]="true"
  [style]="{ width: '420px' }"
  [draggable]="false"
  [resizable]="false"
  [appendTo]="'body'"
>
  <ng-container *ngIf="!sent; else sentTpl">
    <p class="fp-hint">
      Ingresa tu email y te enviaremos un enlace para restablecer tu contraseña.
    </p>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="fp-field">
        <label for="fp-email" class="fp-label">Correo Electrónico</label>
        <input
          pInputText
          id="fp-email"
          type="email"
          formControlName="email"
          class="w-full"
          [class.ng-invalid]="hasError('email', 'required') || hasError('email', 'email')"
          [class.ng-dirty]="form.get('email')?.touched"
          placeholder="correo@ejemplo.com"
        />
        <small class="p-error" *ngIf="hasError('email', 'required')">El correo es requerido</small>
        <small class="p-error" *ngIf="hasError('email', 'email')">El correo no es válido</small>
      </div>

      <div class="fp-actions">
        <ui-button
          type="submit"
          label="Enviar enlace"
          icon="pi pi-send"
          [loading]="isLoading"
          [fullWidth]="true"
        ></ui-button>
        <ui-button
          type="button"
          label="Cancelar"
          severity="secondary"
          variant="outlined"
          [fullWidth]="true"
          (clicked)="close()"
        ></ui-button>
      </div>
    </form>
  </ng-container>

  <ng-template #sentTpl>
    <div class="fp-sent">
      <i class="pi pi-envelope fp-sent-icon"></i>
      <h3 class="fp-sent-title">Revisa tu bandeja de entrada</h3>
      <p class="fp-sent-msg">
        Si el email está registrado, recibirás un enlace para restablecer tu contraseña.
      </p>
      <ui-button label="Cerrar" severity="secondary" variant="outlined" [fullWidth]="true" (clicked)="close()"></ui-button>
    </div>
  </ng-template>
</p-dialog>
