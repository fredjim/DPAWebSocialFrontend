<app-custom-toast #toastRef key="resetToast" position="top-right"></app-custom-toast>

<div class="reset-page">
  <p-card styleClass="reset-card">

    <div class="reset-header">
      <i class="pi pi-lock reset-lock-icon"></i>
      <h2 class="reset-title">Restablecer contraseña</h2>
      <p class="reset-subtitle">Ingresa tu nueva contraseña</p>
    </div>

    <ng-container *ngIf="token; else noTokenTpl">
      <form [formGroup]="form" (ngSubmit)="submit()">

        <div class="rp-field">
          <label for="newPwd" class="rp-label">Nueva contraseña</label>
          <p-password
            inputId="newPwd"
            formControlName="newPassword"
            [toggleMask]="true"
            [feedback]="false"
            styleClass="w-full"
            inputStyleClass="w-full"
            [class.ng-invalid]="hasError('newPassword', 'required') || hasError('newPassword', 'passwordLength')"
            [class.ng-dirty]="form.get('newPassword')?.touched"
            placeholder="Mínimo 8 caracteres"
          ></p-password>
          <small class="p-error" *ngIf="hasError('newPassword', 'required')">La contraseña es requerida</small>
          <small class="p-error" *ngIf="hasError('newPassword', 'passwordLength')">Debe tener entre 8 y 20 caracteres</small>
        </div>

        <div class="rp-field">
          <label for="confirmPwd" class="rp-label">Confirmar contraseña</label>
          <p-password
            inputId="confirmPwd"
            formControlName="confirmPassword"
            [toggleMask]="true"
            [feedback]="false"
            styleClass="w-full"
            inputStyleClass="w-full"
            [class.ng-invalid]="hasError('confirmPassword', 'required') || hasError('confirmPassword', 'mismatch')"
            [class.ng-dirty]="form.get('confirmPassword')?.touched"
            placeholder="Repite la contraseña"
          ></p-password>
          <small class="p-error" *ngIf="hasError('confirmPassword', 'required')">La confirmación es requerida</small>
          <small class="p-error" *ngIf="hasError('confirmPassword', 'mismatch')">Las contraseñas no coinciden</small>
        </div>

        <div class="rp-actions">
          <!-- Hidden submit keeps Enter-key behavior on inputs -->
          <button type="submit" hidden tabindex="-1" aria-hidden="true"></button>
          <ui-button
            type="button"
            label="Actualizar contraseña"
            icon="pi pi-check"
            [loading]="isLoading"
            [fullWidth]="true"
            (clicked)="submit()"
          ></ui-button>
          <ui-button
            type="button"
            label="Cancelar"
            severity="secondary"
            variant="outlined"
            [fullWidth]="true"
            (clicked)="goHome()"
          ></ui-button>
        </div>

      </form>
    </ng-container>

    <ng-template #noTokenTpl>
      <div class="rp-invalid">
        <i class="pi pi-exclamation-triangle rp-invalid-icon"></i>
        <p>El link no es válido o ha expirado.</p>
        <ui-button label="Ir al inicio" icon="pi pi-home" severity="secondary" variant="outlined" (clicked)="goHome()"></ui-button>
      </div>
    </ng-template>

  </p-card>
</div>
